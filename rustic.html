<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema Rustic Gold - Romeo & Juliet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } .font-cinzel { font-family: 'Cinzel', serif; } </style>
</head>
<body class="bg-amber-950 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-[#1a120b] text-amber-100 min-h-screen shadow-2xl relative border-x border-amber-900/40">
        <div class="relative h-[80vh] flex flex-col justify-between p-8 text-center bg-cover bg-center" style="background-image: linear-gradient(to bottom, rgba(26,18,11,0.6), rgba(26,18,11,0.95)), url('https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80');">
            <span class="text-xs tracking-[0.4em] uppercase text-amber-400 font-bold pt-6">WE ARE GETTING MARRIED</span>
            <div>
                <h1 class="text-4xl font-cinzel text-amber-300 tracking-wider mb-2">ROMEO & JULIET</h1>
                <p class="text-xs text-amber-200/80">12 . 10 . 2026</p>
            </div>
            <div class="bg-amber-900/40 backdrop-blur-md p-4 rounded-2xl border border-amber-500/30">
                <span class="text-xs text-amber-300 font-semibold tracking-widest uppercase">TEMA RUSTIC GOLD</span>
            </div>
        </div>
        <div class="p-8 text-center space-y-6">
            <h2 class="text-2xl font-cinzel text-amber-300">WEDDING CELEBRATION</h2>
            <div class="p-6 bg-amber-900/20 rounded-2xl border border-amber-800/40 space-y-2">
                <p class="font-bold text-amber-200">Rustic Hall & Resort</p>
                <p class="text-xs text-amber-400/80">Jl. Nuansa Alam No. 88</p>
                <a href="https://maps.app.goo.gl/5FNxgBE4XruSALrc7?g_st=ic" target="_blank" class="inline-block mt-3 px-5 py-2 bg-amber-600 text-amber-950 font-bold rounded-full text-xs shadow-lg">
                    <i class="fa-solid fa-map-pin"></i> Navigasi Lokasi
                </a>
            </div>
        </div>
    </div>
</body>
</html>
