<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survei Umpan Balik Pengguna - MomenKita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4">

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-rose-500 via-purple-600 to-indigo-600 p-8 text-white text-center">
            <span class="inline-block bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider mb-2">Evaluasi Platform</span>
            <h1 class="text-3xl font-extrabold mb-2">Survei Pengalaman MomenKita</h1>
            <p class="text-rose-100 text-sm max-w-md mx-auto">Bantu kami meningkatkan kualitas website undangan digital ini dengan masukan & saran dari Anda.</p>
        </div>

        <!-- Form Survei -->
        <form id="surveyForm" class="p-6 md:p-8 space-y-8">
            <!-- 1. Identitas -->
            <div class="space-y-4">
                <h3 class="text-lg font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                    <span class="w-6 h-6 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-xs font-bold">1</span>
                    Informasi Pengisi
                </h3>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap *</label>
                        <input type="text" id="nama" required placeholder="Contoh: Budi Santoso" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Status / Peran *</label>
                        <select id="status" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-rose-500 outline-none text-sm bg-white">
                            <option value="">-- Pilih Status --</option>
                            <option value="Calon Pengantin">Calon Pengantin</option>
                            <option value="Tamu Undangan">Tamu Undangan</option>
                            <option value="Teman / Kerabat">Teman / Kerabat</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 2. Penilaian Desain & Kemudahan -->
            <div class="space-y-4">
                <h3 class="text-lg font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                    <span class="w-6 h-6 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">2</span>
                    Desain & Kemudahan (UI/UX)
                </h3>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Seberapa menarik tampilan visual website MomenKita?</label>
                    <div class="grid grid-cols-5 gap-2 text-center">
                        <label class="cursor-pointer">
                            <input type="radio" name="desain" value="1" required class="peer hidden">
                            <div class="py-2 rounded-xl border border-slate-200 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 text-sm font-bold text-slate-600 hover:bg-slate-50">1 ⭐</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="desain" value="2" class="peer hidden">
                            <div class="py-2 rounded-xl border border-slate-200 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 text-sm font-bold text-slate-600 hover:bg-slate-50">2 ⭐</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="desain" value="3" class="peer hidden">
                            <div class="py-2 rounded-xl border border-slate-200 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 text-sm font-bold text-slate-600 hover:bg-slate-50">3 ⭐</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="desain" value="4" class="peer hidden">
                            <div class="py-2 rounded-xl border border-slate-200 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 text-sm font-bold text-slate-600 hover:bg-slate-50">4 ⭐</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="desain" value="5" class="peer hidden">
                            <div class="py-2 rounded-xl border border-slate-200 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 text-sm font-bold text-slate-600 hover:bg-slate-50">5 ⭐</div>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Apakah navigasi web mudah dipahami saat dibuka dari HP?</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="kemudahan" value="Sangat Mudah" required class="text-rose-500 focus:ring-rose-500">
                            <span class="text-sm text-slate-700">Sangat Mudah</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="kemudahan" value="Cukup Mudah" class="text-rose-500 focus:ring-rose-500">
                            <span class="text-sm text-slate-700">Cukup Mudah</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="kemudahan" value="Sulit" class="text-rose-500 focus:ring-rose-500">
                            <span class="text-sm text-slate-700">Sulit / Bingung</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 3. Fitur & Harga -->
            <div class="space-y-4">
                <h3 class="text-lg font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                    <span class="w-6 h-6 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-xs font-bold">3</span>
                    Fitur & Harga Paket
                </h3>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Fitur mana yang menurut Anda paling berguna? (Bisa pilih lebih dari 1)</label>
                    <div class="grid grid-cols-2 gap-2 text-sm text-slate-700">
                        <label class="flex items-center gap-2 p-2 border rounded-xl hover:bg-slate-50 cursor-pointer">
                            <input type="checkbox" name="fitur" value="RSVP WhatsApp" class="rounded text-rose-500"> RSVP via WhatsApp
                        </label>
                        <label class="flex items-center gap-2 p-2 border rounded-xl hover:bg-slate-50 cursor-pointer">
                            <input type="checkbox" name="fitur" value="Peta Google Maps" class="rounded text-rose-500"> Navigasi Maps
                        </label>
                        <label class="flex items-center gap-2 p-2 border rounded-xl hover:bg-slate-50 cursor-pointer">
                            <input type="checkbox" name="fitur" value="Musik Background" class="rounded text-rose-500"> Musik Latar
                        </label>
                        <label class="flex items-center gap-2 p-2 border rounded-xl hover:bg-slate-50 cursor-pointer">
                            <input type="checkbox" name="fitur" value="Amplop Digital" class="rounded text-rose-500"> Amplop Digital
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Bagaimana pendapat Anda tentang penawaran harga (Rp 49rb - 99rb)?</label>
                    <select id="harga_opinion" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-rose-500 text-sm bg-white">
                        <option value="">-- Pilih Pendapat --</option>
                        <option value="Sangat Murah">Sangat Murah & Terjangkau</option>
                        <option value="Pas / Sesuai">Pas & Sesuai dengan Fitur</option>
                        <option value="Agak Mahal">Agak Mahal</option>
                    </select>
                </div>
            </div>

            <!-- 4. Saran & Masukan -->
            <div class="space-y-4">
                <h3 class="text-lg font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                    <span class="w-6 h-6 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-xs font-bold">4</span>
                    Saran & Masukan
                </h3>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Apa hal yang perlu kami tingkatkan atau perbaiki?</label>
                    <textarea id="saran" rows="3" placeholder="Tuliskan saran atau kendala yang ditemui..." class="w-full p-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-rose-500 text-sm outline-none"></textarea>
                </div>
            </div>

            <!-- Kirim -->
            <button type="submit" class="w-full py-4 bg-gradient-to-r from-rose-500 to-indigo-600 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 hover:opacity-95 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Kirim Hasil Survei via WhatsApp
            </button>
        </form>
    </div>

    <script>
        document.getElementById('surveyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nama = document.getElementById('nama').value;
            const status = document.getElementById('status').value;
            const desain = document.querySelector('input[name="desain"]:checked')?.value || '-';
            const kemudahan = document.querySelector('input[name="kemudahan"]:checked')?.value || '-';
            const harga = document.getElementById('harga_opinion').value;
            const saran = document.getElementById('saran').value || 'Tidak ada';

            const fiturChecked = Array.from(document.querySelectorAll('input[name="fitur"]:checked')).map(cb => cb.value).join(', ') || 'Tidak ada';

            const pesanWA = `*HASIL SURVEI MOMENKITA*%0A%0A` +
                `👤 *Nama:* ${nama}%0A` +
                `🏷️ *Status:* ${status}%0A` +
                `⭐ *Rating Desain:* ${desain}/5%0A` +
                `📱 *Kemudahan:* ${kemudahan}%0A` +
                `💡 *Fitur Favorit:* ${fiturChecked}%0A` +
                `💰 *Pendapat Harga:* ${harga}%0A` +
                `💬 *Saran:* ${saran}`;

            // Nomor pengembang
            window.open(`https://wa.me/?text=${pesanWA}`, '_blank');
        });
    </script>
</body>
</html>
