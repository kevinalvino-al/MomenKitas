<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema Floral Elegance - Romeo & Juliet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } .font-serif-custom { font-family: 'Playfair Display', serif; } </style>
</head>
<body class="bg-rose-50 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative border-x border-rose-100">
        <div class="relative h-[80vh] flex flex-col justify-between p-8 text-center text-rose-900 bg-cover bg-center" style="background-image: linear-gradient(to bottom, rgba(255,241,242,0.5), rgba(255,228,230,0.9)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80');">
            <span class="text-xs tracking-[0.3em] uppercase text-rose-600 font-bold pt-6">The Wedding Of</span>
            <div>
                <h1 class="text-5xl font-serif-custom text-rose-700 mb-2">Romeo & Juliet</h1>
                <p class="text-xs text-rose-500 font-medium">12 OKTOBER 2026</p>
            </div>
            <div class="bg-white/70 backdrop-blur-md p-4 rounded-2xl border border-rose-200">
                <span class="text-xs text-rose-600 font-semibold">TEMA FLORAL ELEGANCE</span>
            </div>
        </div>
        <div class="p-8 text-center space-y-6">
            <h2 class="text-2xl font-serif-custom text-rose-800">Acara Pernikahan</h2>
            <div class="p-6 bg-rose-50/60 rounded-2xl border border-rose-100 space-y-2">
                <p class="font-bold text-rose-900">Akad & Resepsi</p>
                <p class="text-xs text-rose-600">Gedung Floral Garden, Jakarta</p>
                <a href="https://maps.app.goo.gl/5FNxgBE4XruSALrc7?g_st=ic" target="_blank" class="inline-block mt-3 px-5 py-2 bg-rose-500 text-white rounded-full text-xs font-bold shadow-md shadow-rose-200">
                    <i class="fa-solid fa-location-dot"></i> Petunjuk Google Maps
                </a>
            </div>
        </div>
    </div>
</body>
</html>
