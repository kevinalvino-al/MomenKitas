<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema Modern Minimalist - Romeo & Juliet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Space Grotesk', sans-serif; } </style>
</head>
<body class="bg-slate-950 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-slate-900 text-slate-100 min-h-screen shadow-2xl relative border-x border-slate-800">
        <div class="relative h-[80vh] flex flex-col justify-between p-8 text-center bg-cover bg-center" style="background-image: linear-gradient(to bottom, rgba(15,23,42,0.4), rgba(15,23,42,0.95)), url('https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=800&q=80');">
            <span class="text-xs tracking-widest uppercase text-indigo-400 font-bold pt-6">// INVITATION</span>
            <div>
                <h1 class="text-5xl font-extrabold tracking-tight text-white mb-2">ROMEO<br>& JULIET</h1>
                <p class="text-xs text-indigo-300 font-mono">12.10.2026</p>
            </div>
            <div class="bg-slate-800/80 backdrop-blur-md p-4 rounded-xl border border-slate-700">
                <span class="text-xs text-indigo-400 font-mono">TEMA MODERN MINIMALIST</span>
            </div>
        </div>
        <div class="p-8 text-center space-y-6">
            <h2 class="text-xl font-bold tracking-wider uppercase text-slate-200">THE VENUE</h2>
            <div class="p-6 bg-slate-800/50 rounded-2xl border border-slate-700/60 space-y-2">
                <p class="font-bold text-white">Modern Ball Room</p>
                <p class="text-xs text-slate-400">Pusat Kota Jakarta</p>
                <a href="https://maps.app.goo.gl/5FNxgBE4XruSALrc7?g_st=ic" target="_blank" class="inline-block mt-3 px-5 py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-compass"></i> Buka Google Maps
                </a>
            </div>
        </div>
    </div>
</body>
</html>
